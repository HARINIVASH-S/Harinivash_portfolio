<section class="section pointer" id=portfolio><div class=container><div class="row justify-content-center txt-bg txt-bg-portfolio"><div class=col-lg-6><div class="wow fadeIn section-title text-center mb-4 pb-2"><div class="mb-5 pb-3"> <i class="far fa-clone h1 text-muted"></i></div><h2 class="h3 font-weight-bold">My Portfolio</h2><p class="text-muted mx-auto mb-0 mt-4 para-desc">Sample of some of my projects</p></div></div></div><div class="row container-grid mt-4 pt-2"><div *ngFor="let project of portfolioData" class="wow {{project['animationClass']}} col-lg-4 spacing" [attr.data-wow-delay]="[project['delay']]"><div class="item-box m-2"><img class="item-container img-fluid mx-auto" src="assets/images/portfolio/{{project['project']}}.png" alt="{{project['project'].replaceAll('-',' ')}}" title="{{project['project'].replaceAll('-',' ')}}" width="698" height="543" loading="lazy"><div class="item-mask"><div class="item-caption text-white text-center w-100 px-3"><h3 class="h5 mb-3">{{project['project'].replaceAll('-',' ')}}</h3><p class="text-uppercase mb-4">{{project['description']}}</p><div class="d-flex justify-content-center flex-wrap"><a *ngIf="project['github']" [href]="project['github']" target="_blank" rel="noreferrer" class="btn btn-outline-light btn-sm mx-1 mt-1"><i class="fab fa-github mr-1"></i> GitHub</a><a *ngIf="project['live']" [href]="project['live']" target="_blank" rel="noreferrer" class="btn btn-outline-light btn-sm mx-1 mt-1"><i class="fas fa-external-link-alt mr-1"></i> Live Demo</a></div></div></div></div></div></div></div></section>
